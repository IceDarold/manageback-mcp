server {
    listen unix:/opt/hiddify-manager/nginx/run/h1.sock proxy_protocol;
    server_name managebac.archik.tech;
    set_real_ip_from unix:;
    real_ip_header proxy_protocol;
    client_max_body_size 16k;
    location ^~ /.well-known/acme-challenge/ {
        root /opt/hiddify-manager/acme.sh/www;
        try_files $uri =404;
    }
    location / {
        if ($proxy_protocol_server_port = 80) { return 308 https://$host$request_uri; }
        proxy_pass http://127.0.0.1:8134;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
