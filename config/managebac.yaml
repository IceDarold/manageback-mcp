base_url: "https://theislandprivateschool.managebac.com"
timezone: "Europe/Nicosia"

auth:
  login_url: "/login"
  username_env: "MANAGEBAC_LOGIN"
  password_env: "MANAGEBAC_PASSWORD"

routes:
  classes_index: "/student/classes/my"
  class_page: "/student/classes/{class_id}"
  class_tasks: "/student/classes/{class_id}/core_tasks"
  task_page: "/student/classes/{class_id}/core_tasks/{task_id}"
  task_dropbox: "/student/classes/{class_id}/core_tasks/{task_id}/dropbox"
  cas_index: "/student/ib/activity/cas"
  cas_experience: "/student/ib/activity/cas/{experience_id}"
  cas_reflections: "/student/ib/activity/cas/{experience_id}/reflections"
  tasks_and_deadlines: "/student/tasks_and_deadlines"
  timetable_weekly: "/student/timetables/weekly"

timeouts_ms:
  navigation: 30000
  action: 15000
  upload: 120000

selectors:
  login_username:
    - "input[name='login']"
    - "input[type='email']"
  login_password:
    - "input[name='password']"
    - "input[type='password']"
  login_submit:
    - "input[type='submit']"
    - "button:has-text('Log in')"
    - "button[type='submit']"
  classes_cards:
    - "a[href*='/student/classes/']"
  task_links:
    - "a[href*='/core_tasks/']"
  dropbox_file_input:
    - "form.edit_dropbox input[type='file']"
    - "input[type='file']"
  # ManageBac renders the upload control as <input type="submit" value="Upload
  # Files">, which has no inner text, so a button:has-text selector matches
  # nothing at all and every submission died on the click. Verified against a
  # live dropbox page.
  dropbox_upload_button:
    - "form.edit_dropbox input[type='submit'][name='commit']"
    - "input[type='submit'][value='Upload Files']"
  cas_add_experience:
    - "a:has-text('Add CAS Experience')"
    - "button:has-text('Add CAS Experience')"
  cas_add_reflection:
    - "a:has-text('Add Reflections & Evidence')"
    - "button:has-text('Add Reflections & Evidence')"

features:
  startup_sync: false
  save_artifacts_on_success: true
