base_url: "https://theislandprivateschool.managebac.com"
timezone: "Europe/Nicosia"

auth:
  login_url: "/login"
  username_env: "MANAGEBAC_LOGIN"
  password_env: "MANAGEBAC_PASSWORD"

routes:
  classes_index: "/student/classes/my"
  class_page: "/student/classes/{class_id}"
  class_tasks: "/student/classes/{class_id}/core_tasks"
  task_page: "/student/classes/{class_id}/core_tasks/{task_id}"
  task_dropbox: "/student/classes/{class_id}/core_tasks/{task_id}/dropbox"
  cas_index: "/student/ib/activity/cas"
  cas_new: "/student/ib/activity/cas/new"
  cas_experience: "/student/ib/activity/cas/{experience_id}"
  cas_reflections: "/student/ib/activity/cas/{experience_id}/reflections"
  cas_reflection_new: "/student/ib/activity/cas/{experience_id}/reflections/new"
  tasks_and_deadlines: "/student/tasks_and_deadlines"
  timetable_weekly: "/student/timetables/weekly"

timeouts_ms:
  navigation: 30000
  action: 15000
  upload: 120000

selectors:
  login_username:
    - "input[name='login']"
    - "input[type='email']"
  login_password:
    - "input[name='password']"
    - "input[type='password']"
  login_submit:
    - "input[type='submit']"
    - "button:has-text('Log in')"
    - "button[type='submit']"
  classes_cards:
    - "a[href*='/student/classes/']"
  task_links:
    - "a[href*='/core_tasks/']"
  dropbox_file_input:
    - "form.edit_dropbox input[type='file']"
    - "input[type='file']"
  # ManageBac renders the upload control as <input type="submit" value="Upload
  # Files">, which has no inner text, so a button:has-text selector matches
  # nothing at all and every submission died on the click. Verified against a
  # live dropbox page.
  dropbox_upload_button:
    - "form.edit_dropbox input[type='submit'][name='commit']"
    - "input[type='submit'][value='Upload Files']"
  # The new-experience form (form#new_cas_activity). Same shape as the
  # reflection form: reached by URL, submitted by an input, not a button.
  cas_experience_name:
    - "form#new_cas_activity input[name='cas_activity[name]']"
  cas_experience_notes:
    - "form#new_cas_activity textarea[name='cas_activity[notes]']"
  cas_experience_submit:
    - "form#new_cas_activity input[type='submit'][name='commit']"
  # Every field below lives in ManageBac's single reflection form
  # (form#new_evidence); a type tile enables the ones its kind needs and leaves
  # the rest disabled. Names verified against a live form.
  # Scoped to the body field's own group: the journal text is a rich-text widget
  # over a hidden textarea, and it is the widget that syncs into the textarea on
  # submit, so the widget is what has to be filled.
  cas_reflection_body:
    - "form#new_evidence .evidence_body .fr-element[contenteditable='true']"
    - "form#new_evidence .fr-element[contenteditable='true']"
  cas_reflection_url:
    - "form#new_evidence input[name='evidence[url]']"
  cas_reflection_file:
    - "form#new_evidence input[name='evidence[asset_attributes][file]']"
  cas_reflection_photo:
    - "form#new_evidence input[name='evidence[photos_attributes][0][file]']"
  cas_reflection_photo_caption:
    - "form#new_evidence input[name='evidence[photos_attributes][0][caption]']"
  cas_outcome_checkbox:
    - "form#new_evidence input[type='checkbox'][name='evidence[learning_outcome_ids][]'], form#new_cas_activity input[type='checkbox'][name='cas_activity[learning_outcome_ids][]']"
  cas_reflection_submit:
    - "form#new_evidence input[type='submit'][name='commit']"

features:
  startup_sync: false
  save_artifacts_on_success: true
